services:
  # ── Python / FastAPI Backend ──────────────────────────────────────────────
  - type: web
    name: eduinsight-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FRONTEND_URL
        sync: false        # set this manually in the Render dashboard

  # ── React / Vite Frontend ─────────────────────────────────────────────────
  - type: web
    name: eduinsight-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: VITE_API_URL
        sync: false        # set this to your backend URL in the Render dashboard
